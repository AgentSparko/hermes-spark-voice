name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pytest pytest-asyncio pyyaml numpy httpx websockets pillow
      - run: python -m pytest -q plugin/tests
      - run: python -m pytest -q calld/tests
      - run: sudo apt-get install -y shellcheck && shellcheck install.sh spark/*.sh scripts/*.sh
